<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Foodly | Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh
        }

        .box {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            text-align: center
        }

        button {
            padding: 12px 24px;
            font-size: 16px
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Confirm Order</h2>
        <p>Your food will be delivered soon 🍕</p><br>
        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script>
        function placeOrder() {
            localStorage.removeItem("cart");
            alert("Order placed successfully!");
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
