<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Foodly | Food Delivery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial;
            background: #f8f8f8
        }

        .nav {
            background: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eaeaea
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #EF4F5F
        }

        .container {
            padding: 24px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            overflow: hidden;
            cursor: pointer;
            transition: .3s
        }

        .card:hover {
            transform: translateY(-6px)
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover
        }

        .card .info {
            padding: 14px
        }

        .badge {
            background: #2ecc71;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px
        }
    </style>
</head>

<body>

    <div class="nav">
        <div class="logo">Foodly</div>
        <div>📍 Varanasi</div>
    </div>

    <div class="container">
        <h2>Restaurants Near You</h2><br>

        <div class="grid">
            <div class="card" onclick="location.href='restaurant.html'">
                <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
                <div class="info">
                    <h4>Pizza Palace</h4>
                    <p>Italian • Pizza</p>
                    <span class="badge">4.5 ★</span> • 30 mins
                </div>
            </div>
        </div>
    </div>

</body>

</html>
